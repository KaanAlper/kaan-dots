# Edge-Drop rules
windowrulev2 = float, class:^(edge-drop)$
windowrulev2 = pin, class:^(edge-drop)$
windowrulev2 = move 2176 0, class:^(edge-drop)$
windowrulev2 = noborder, class:^(edge-drop)$
windowrulev2 = noshadow, class:^(edge-drop)$
windowrulev2 = rounding 0, class:^(edge-drop)$
windowrulev2 = noanim, class:^(edge-drop)$
windowrulev2 = noblur, class:^(edge-drop)$
windowrulev2 = noinitialfocus, class:^(edge-drop)$
